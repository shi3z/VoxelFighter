<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voxel Fighter</title>
<link rel="icon" href="data:," />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b2a5a; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
  .hud { position: fixed; font: bold 12px/1.35 "SF Mono", Menlo, monospace; color: #fff; letter-spacing: 1px;
         text-shadow: 1px 1px 0 #0a2a55, -1px 1px 0 #0a2a55, 1px -1px 0 #0a2a55, -1px -1px 0 #0a2a55; pointer-events: none; user-select: none; }
  #hudL { left: 16px; bottom: 14px; }
  #hudR { right: 16px; bottom: 14px; text-align: right; }
  #hudT { left: 0; right: 0; top: 14px; text-align: center; font-size: 11px; opacity: .85; }
  #msg { left: 0; right: 0; top: 36%; text-align: center; font-size: 34px; letter-spacing: 6px; }
  #msg small { display: block; font-size: 13px; letter-spacing: 3px; margin-top: 10px; }
  #dbg { left: 10px; top: 8px; font-size: 11px; color: #eaffd0; display: none; white-space: pre; }
  #help { left: 0; right: 0; bottom: 46px; text-align: center; font-size: 11px; opacity: .8; transition: opacity 2s; }
  .bar { display: inline-block; width: 84px; height: 7px; background: rgba(0,20,60,.55); border: 1px solid #fff; vertical-align: middle; margin-left: 6px; }
  .bar > i { display: block; height: 100%; width: 50%; background: #fff; }
  #hpbar > i { background: #7dff6a; }
  #thbar > i { background: #ffd34a; }
  #bsbar > i { background: #ff8a3a; }
  #flash { position: fixed; inset: 0; background: #ff2a1a; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<canvas id="overlay"></canvas>
<div id="flash"></div>
<div id="hudT" class="hud">KILLS <span id="kills">0</span> &nbsp;·&nbsp; SCORE <span id="score">0</span></div>
<div id="hudL" class="hud">
  SPD <span id="spd">000</span> km/h<br />
  THR<span class="bar" id="thbar"><i></i></span><br />
  BST<span class="bar" id="bsbar"><i></i></span><br />
  MSL <span id="msl">▮▮▮▮▮▮</span>
</div>
<div id="hudR" class="hud">
  HP<span class="bar" id="hpbar"><i></i></span><br />
  ALT <span id="alt">000</span> m
</div>
<div id="msg" class="hud"></div>
<div id="help" class="hud">W/S throttle · ↑↓ pitch · ←→ turn · A/D roll · Shift boost · Space fire · X missile (hold aim to lock) · C camera · P pause · R restart · F3 debug</div>
<div id="lk" class="hud" style="left:0;right:0;top:30%;text-align:center;font-size:14px;letter-spacing:4px"></div>
<div id="dbg" class="hud"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
